<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  :root{
    --bg:#f7f5f0; --panel:#ffffff; --text:#2b2b2b; --muted:#8a8a8a;
    --line:#e7e3da; --brand:#4a7ba6; --brand-soft:#eaf1f6; --amber:#d99a4e;
    --green:#5b9a6b; --red:#c46a5e; --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
    padding-bottom:72px;
  }
  /* 顶栏 */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--line);
  }
  .brand{font-size:18px; font-weight:600; letter-spacing:.5px}
  .brand small{color:var(--muted); font-weight:400; font-size:12px; margin-left:6px}
  .topactions{display:flex; gap:8px}
  /* 通用控件 */
  button{
    font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel);
    color:var(--text); border-radius:10px; padding:7px 12px; transition:.15s;
  }
  button:hover{border-color:var(--brand)}
  button.primary{background:var(--brand); color:#fff; border-color:var(--brand)}
  button.primary:hover{filter:brightness(1.05)}
  button.ghost{background:transparent; border-color:transparent; color:var(--brand)}
  button.sm{padding:4px 9px; font-size:13px; border-radius:8px}
  button.danger{color:var(--red); border-color:#f0d8d3}
  input,select,textarea{
    font:inherit; width:100%; padding:9px 11px; border:1px solid var(--line);
    border-radius:10px; background:var(--panel); color:var(--text); outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  textarea{resize:vertical; min-height:64px}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px}
  .row{display:flex; gap:10px}
  .row>*{flex:1}
  /* 内容区 */
  main{padding:16px; max-width:880px; margin:0 auto}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 6px; font-size:16px}
  .meta{color:var(--muted); font-size:13px}
  .tag{display:inline-block; background:var(--brand-soft); color:var(--brand);
    font-size:12px; padding:2px 8px; border-radius:20px; margin:2px 4px 2px 0}
  .tag.amber{background:#fbeed9; color:#b07d2e}
  .tag.green{background:#e4f0e7; color:#3f7a52}
  .pill{display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); border:1px solid var(--line); padding:2px 9px; border-radius:20px}
  .empty{text-align:center; color:var(--muted); padding:40px 16px}
  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  /* 子标签 */
  .subtabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
  .subtabs button{border:none; background:transparent; color:var(--muted); padding:6px 4px; border-bottom:2px solid transparent; border-radius:0}
  .subtabs button.active{color:var(--brand); border-bottom-color:var(--brand); font-weight:600}
  /* 媒体网格 */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin-top:10px}
  .grid .item{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#0001}
  .grid .item img,.grid .item video{width:100%; height:96px; object-fit:cover; display:block}
  .grid .item .cap{padding:5px 7px; font-size:11px; color:var(--muted)}
  /* 底部 Tab */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; background:var(--panel); border-top:1px solid var(--line);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1; border:none; background:transparent; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; padding:6px 0;
  }
  .tabbar button.active{color:var(--brand)}
  .tabbar button .ic{font-size:20px}
  /* 模态框 */
  .modal{position:fixed; inset:0; z-index:50; background:rgba(40,40,40,.45);
    display:flex; align-items:flex-end; justify-content:center}
  .modal.hidden{display:none}
  .modal-box{
    background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow:auto;
    border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:up .2s ease;
  }
  @keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
  .modal-box h2{margin:0 0 6px; font-size:18px}
  .modal-actions{display:flex; gap:10px; margin-top:16px}
  .modal-actions button{flex:1}
  /* 提示条 */
  .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
    background:#2b2b2b; color:#fff; padding:9px 16px; border-radius:22px; font-size:13px; z-index:60; opacity:0; transition:.25s}
  .toast.show{opacity:1}
  /* 短视频分镜 */
  .scene{border-left:3px solid var(--brand); padding:8px 12px; margin:8px 0; background:var(--panel); border-radius:0 10px 10px 0}
  .scene .no{font-weight:600; color:var(--brand)}
  .tip-box{background:var(--brand-soft); border-radius:10px; padding:12px; margin:10px 0; font-size:14px}
  .tip-box b{color:var(--brand)}
  .hidden{display:none!important}
  .switch{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line)}
  .switch:last-child{border-bottom:none}
  details{margin:10px 0}
  summary{cursor:pointer; color:var(--brand); font-size:14px}
  .seg{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0}
  .seg button{padding:5px 10px; font-size:13px}
  .seg button.on{background:var(--brand); color:#fff; border-color:var(--brand)}
</style>
</head>

function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

/* ============ IndexedDB ============ */
const DB = { db:null };
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("youjizhiDB", 1);
    r.onupgradeneeded = (e)=>{
      const db = e.target.result;
      const mk = (name)=>{ if(!db.objectStoreNames.contains(name)) db.createObjectStore(name,{keyPath:"id"}); };
      ["records","logs","destinations","reminders","meta"].forEach(mk);
      if(!db.transaction){}
    };
    r.onsuccess = ()=>{ DB.db = r.result; res(DB.db); };
    r.onerror = ()=>rej(r.error);
  });
}
function tx(store, mode){ return DB.db.transaction(store, mode).objectStore(store); }
function dbPut(store, val){ return new Promise((res,rej)=>{ const r=tx(store,"readwrite").put(val); r.onsuccess=()=>res(val); r.onerror=()=>rej(r.error); }); }
function dbGet(store, id){ return new Promise((res,rej)=>{ const r=tx(store,"readonly").get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbAll(store){ return new Promise((res,rej)=>{ const r=tx(store,"readonly").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
function dbDel(store, id){ return new Promise((res,rej)=>{ const r=tx(store,"readwrite").delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
function getMeta(key, def){ return dbGet("meta", key).then(v=> v ? v.value : def); }
function setMeta(key, value){ return dbPut("meta", {id:key, value}); }

function renderRecords(){
  const sub = state.sub;
  const subs = [["plan","旅游计划"],["guide","打卡攻略"],["done","已完成"],["explore","探索/推送"]];
  const tabs = subs.map(([k,t])=>`<button class="${sub===k?'active':''}" data-act="sub" data-k="${k}">${t}</button>`).join("");
  let body = "";

let _searchTimer;
function debounceSearch(){ clearTimeout(_searchTimer); _searchTimer=setTimeout(doSearch, 300); }
async function doSearch(){
  const kw = ($("#searchKw").value||"").trim().toLowerCase();
  const prov = $("#fProv").value, type=$("#fType").value, season=$("#fSeason").value, style=$("#fStyle").value;
  const dests = await dbAll("destinations");
  const res = dests.filter(d=>{
    if(prov && d.province!==prov) return false;
    if(type && d.type!==type) return false;
    if(style && d.playStyle!==style) return false;
    if(season){ const ms=SEASON[season]; if(!d.best.some(m=>ms.includes(m))) return false; }
    if(kw){
      const hay = (d.name+d.desc+(d.tags||[]).join("")+(d.province)).toLowerCase();
      if(!hay.includes(kw)) return false;
    }
    return true;
  });
  const box = $("#searchRes");
  if(!res.length){ box.innerHTML = `<div class="empty">没有匹配的目的地，可点右上角“新增目的地”补充</div>`; return; }
  box.innerHTML = `<div class="meta" style="margin-bottom:6px">找到 ${res.length} 个</div>` + res.map(d=>`
    <div class="card">
      <h3>${esc(d.name)} <span class="meta" style="font-weight:400">${esc(d.province)}·${esc(d.type)}·${esc(d.playStyle)}</span></h3>
      <div class="meta">最佳季节：${(d.best||[]).map(m=>MONTHS[m]).join("、")||"—"}</div>
      <p style="font-size:14px;margin:6px 0">${esc(d.desc)}</p>
      ${(d.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
      <div class="actions">
        <button class="sm primary" data-act="destToPlan" data-id="${d.id}">加入计划</button>
        <button class="sm" data-act="destToGuide" data-id="${d.id}">存为攻略</button>
        <button class="sm" data-act="destRemind" data-id="${d.id}">当季提醒</button>
      </div>
    </div>`).join("");
}

const urlCache = {};
function objUrl(blob, id){ if(!urlCache[id]) urlCache[id] = URL.createObjectURL(blob); return urlCache[id]; }

function renderLogDetail(){
  return `<div class="actions" style="margin-bottom:10px"><button class="ghost sm" data-act="backLogs">← 返回</button></div><div id="logDetail"></div>`;
}
async function fillLogDetail(){
  const l = await dbGet("logs", state.logId);
  if(!l){ state.logId=null; render(); return; }
  const media = l.media||[];
  const grid = media.map(m=>`
    <div class="item">
      ${m.kind==="video"
        ? `<video src="${objUrl(m.blob,m.id)}" muted playsinline></video>`
        : `<img src="${objUrl(m.blob,m.id)}" alt="">`}

  let planLine = "";
  if(l.planId){ const p = await dbGet("records", l.planId); if(p) planLine = `<div class="meta" style="margin-top:4px">🔗 关联计划：<b>${esc(p.title||"未命名")}</b></div>`; }
  $("#logDetail").innerHTML = `

      <h3>${esc(l.title||"未命名日志")}</h3>

      <div class="actions">
        <button class="sm primary" data-act="addMedia" data-id="${l.id}">+ 加照片/视频</button>
        <button class="sm" data-act="editLog" data-id="${l.id}">编辑信息</button>
        <button class="sm" data-act="toVideo" data-id="${l.id}">去短视频</button>
        <button class="sm danger" data-act="delLog" data-id="${l.id}">删除</button>
      </div>
    </div>
    <div class="card">
      <h3 style="font-size:15px">素材（${media.length}）· 打标签给短视频用</h3>
      ${grid}
    </div>
    <div id="mediaEditor"></div>`;
  bindMediaEditor(l);
}
function bindMediaEditor(l){
  const box = $("#mediaEditor"); if(!box) return;
  box.innerHTML = (l.media||[]).map(m=>`
    <div class="card" data-mid="${m.id}">
      <div class="row" style="align-items:center">
        ${m.kind==="video"?`<video src="${objUrl(m.blob,m.id)}" muted playsinline style="width:64px;height:64px;object-fit:cover;border-radius:8px"></video>`
          :`<img src="${objUrl(m.blob,m.id)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px">`}
        <div style="flex:1">
          <div class="seg" data-f="shot">
            ${["远景","中景","近景","特写","空镜"].map(o=>`<button class="${m.tags.shot===o?'on':''}" data-v="${o}">${o}</button>`).join("")}
          </div>
          <div class="seg" data-f="angle">
            ${["平视","俯拍","仰拍","航拍"].map(o=>`<button class="${m.tags.angle===o?'on':''}" data-v="${o}">${o}</button>`).join("")}
          </div>
        </div>
      </div>
      <div class="row" style="margin-top:8px">
        <label style="margin:0;flex:0 0 auto;display:flex;align-items:center;gap:6px;color:var(--text)"><input type="checkbox" ${m.tags.golden?"checked":""} data-f="golden" style="width:auto"> 🌟黄金时刻</label>
        <input placeholder="情绪/备注，如 治愈、震撼" value="${esc(m.tags.mood||"")}" data-f="mood">
      </div>
      <input style="margin-top:8px" placeholder="这条素材的文案/字幕建议" value="${esc(m.caption||"")}" data-f="caption">
      <div class="actions"><button class="sm danger" data-act="delMedia" data-id="${l.id}" data-mid="${m.id}">删除这条</button></div>
    </div>`).join("");
  [...box.querySelectorAll(".card[data-mid]")].forEach(card=>{
    const mid = card.dataset.mid; const m = (l.media||[]).find(x=>x.id===mid); if(!m) return;
    card.querySelectorAll(".seg").forEach(seg=>{
      const f = seg.dataset.f;
      seg.querySelectorAll("button").forEach(b=> b.onclick=()=>{
        m.tags[f]=b.dataset.v;
        seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
        dbPut("logs", l);
      });
    });
    const gold = card.querySelector('input[data-f="golden"]');
    gold.onchange = ()=>{ m.tags.golden=gold.checked; dbPut("logs", l); };
    const mood = card.querySelector('input[data-f="mood"]');
    mood.oninput = debounce(()=>{ m.tags.mood=mood.value; dbPut("logs", l); }, 400);
    const cap = card.querySelector('input[data-f="caption"]');
    cap.oninput = debounce(()=>{ m.caption=cap.value; dbPut("logs", l); }, 400);
  });
}

async function genVideo(){
  const logId = state.videoSrc || $("#vLog")?.value;
  if(!logId){ toast("先选一条日志"); return; }
  state.videoSrc = logId;
  const l = await dbGet("logs", logId); if(!l){ toast("日志不存在"); return; }
  const media = l.media||[];
  // 分析
  const m = { total:media.length, images:0, videos:0, golden:0, scenery:0, moods:{}, hasGuide:false };
  media.forEach(x=>{ if(x.kind==="video")m.videos++; else m.images++;
    if(x.tags&&x.tags.golden)m.golden++;
    if(x.tags&&(x.tags.shot==="空镜"||x.tags.shot==="远景"))m.scenery++;
    if(x.tags&&x.tags.mood)m.moods[x.tags.mood]=(m.moods[x.tags.mood]||0)+1; });
  const records = await dbAll("records");
  m.hasGuide = records.some(r=>r.kind==="guide" && (r.destination===l.location || (l.title||"").includes(r.destination||"_")));
  const fits = VIDEO_TEMPLATES.filter(t=>t.fit(m));
  const primary = fits[0] || VIDEO_TEMPLATES[0];
  const alt = fits.slice(1);

  // 分镜
  const scenes = media.map((x,i)=>{
    const shot=x.tags&&x.tags.shot||"中景", angle=x.tags&&x.tags.angle||"平视";
    let text = x.caption || suggestText(x, m);
    return {no:i+1, kind:x.kind==="video"?"视频":"照片", shot, angle, golden:x.tags&&x.tags.golden, text,
      dur:x.kind==="video"?"用原片":"2–4 秒"};
  });
  const topMood = Object.entries(m.moods).sort((a,b)=>b[1]-a[1])[0];
  const out = $("#videoOut");
  out.innerHTML = `
    <div class="card">
      <h3>素材分析</h3>
      <div class="meta">共 ${m.total} 条（照片 ${m.images} · 视频 ${m.videos}）｜🌟黄金时刻 ${m.golden} ｜空镜/远景 ${m.scenery}${topMood?`｜主情绪：${topMood[0]}`:""}</div>
    </div>
    <div class="tip-box">
      <b>推荐方案：${esc(primary.name)}</b> — ${esc(primary.desc)}<br>
      🎵 配乐：${esc(primary.music)}<br>
      📐 比例/平台：${esc(primary.platform)}<br>
      🎞 剪辑要点：${esc(primary.shot)}
      ${alt.length?`<br><span class="meta">也可尝试：${alt.map(a=>a.name).join("、")}</span>`:""}
    </div>
    <div class="card">
      <h3 style="font-size:15px">分镜脚本（${scenes.length} 镜）</h3>
      ${scenes.map(s=>`
        <div class="scene">
          <span class="no">#${s.no}</span> <b>${s.kind}</b> · ${esc(s.shot)} · ${esc(s.angle)} ${s.golden?"🌟":""}
          <div class="meta">建议时长：${esc(s.dur)}</div>
          <div style="font-size:14px;margin-top:2px">${esc(s.text)}</div>
        </div>`).join("")}
    </div>
    <div class="card">
      <h3 style="font-size:15px">发布与封面建议</h3>
      <ul style="margin:6px 0;padding-left:18px;font-size:14px">
        <li>封面优先用 <b>黄金时刻</b> 或 <b>人物+地标</b> 的一张，加大字标题。</li>
        <li>竖屏 9:16（1080×1920），前 3 秒必须出爆点，完播率优先。</li>
        <li>字幕用醒目花字，BGM 音量压到人声/原声之下。</li>
        <li>结尾引导互动：“收藏备用 / 你最想去哪？”</li>
        ${m.golden>0?`<li>🌟 把黄金时刻素材放在转场或高潮处，质感拉满。</li>`:""}
      </ul>
      <div class="actions">
        <button class="sm" data-act="copyScript">复制分镜脚本</button>
        <button class="sm" data-act="coverGrid">生成封面九宫格</button>

  LAST_VIDEO = { primary, scenes, m, logId:l.id };
}
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function coverGrid(){
  const logId = state.videoSrc || (LAST_VIDEO&&LAST_VIDEO.logId);
  if(!logId){ toast("请先在上方选一条日志并生成方案"); return; }
  const l = await dbGet("logs", logId); if(!l){ toast("日志不存在"); return; }
  const imgs = (l.media||[]).filter(x=>x.kind==="image");
  if(!imgs.length){ toast("这条日志没有照片，九宫格需要图片素材"); return; }
  const pick = imgs.slice(0,9);
  const N=3, CELL=360, size=CELL*N;
  const cv = document.createElement("canvas"); cv.width=size; cv.height=size;
  const ctx = cv.getContext("2d");
  ctx.fillStyle="#f7f5f0"; ctx.fillRect(0,0,size,size);
  for(let i=0;i<pick.length;i++){
    const col=i%3, row=Math.floor(i/3), x=col*CELL, y=row*CELL;
    let im; try{ im = await loadImg(objUrl(pick[i].blob, pick[i].id)); }catch(e){ continue; }
    const s=Math.max(CELL/im.width, CELL/im.height);
    const w=im.width*s, h=im.height*s;
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,CELL,CELL); ctx.clip();
    ctx.drawImage(im, x+(CELL-w)/2, y+(CELL-h)/2, w, h); ctx.restore();
  }
  ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=4;
  for(let i=1;i<N;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(size,i*CELL); ctx.stroke();
  }
  const title=(l.title||l.location||"游记").slice(0,14);
  ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,size-84,size,84);
  ctx.fillStyle="#fff"; ctx.font="600 40px -apple-system,'PingFang SC',sans-serif"; ctx.textBaseline="middle";
  ctx.fillText(title, 28, size-42);
  cv.toBlob(b=>{
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="封面九宫格-"+(l.title||"游记")+".png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }, "image/png");
  toast(`封面九宫格已生成（${pick.length} 张）`);
}
function copyScript(){
  if(!LAST_VIDEO){ toast("请先生成方案"); return; }
  const { primary, scenes, m } = LAST_VIDEO;
  const txt = `【${primary.name}】素材${m.total}条(照片${m.images}/视频${m.videos}) 黄金${m.golden}\n配乐:${primary.music}\n平台:${primary.platform}\n` +
    scenes.map(s=>`#${s.no} ${s.kind} ${s.shot}/${s.angle}${s.golden?"🌟":""} ${s.dur} | ${s.text}`).join("\n");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("已复制分镜脚本")).catch(()=>toast("复制失败，请手动选择"));
  } else { toast("当前环境不支持自动复制"); }
}
function suggestText(x, m){
  const t = x.tags||{};
  if(t.golden && (t.shot==="空镜"||t.shot==="远景")) return "暖光铺满画面，配一句『这一刻值得早起』，慢推或固定长镜。";
  if(t.shot==="特写") return "放大细节（食物/纹理/表情），字幕点出质感。";
  if(t.angle==="航拍") return "上帝视角交代环境，配『这就是 XX』的开场。";
  if(m.hasGuide) return "展示这个打卡点，字幕写清『怎么拍/为什么来』。";
  return "记录当下氛围，花字或口播带过即可。";
}

/* ============ 媒体缩略图 ============ */
function imgThumb(file){ return new Promise(res=>{ const u=URL.createObjectURL(file); const im=new Image();
  im.onload=()=>{ const c=document.createElement("canvas"); const M=360; const r=Math.min(M/im.width,M/im.height);
    c.width=im.width*r||M; c.height=im.height*r||M; c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",0.72)); URL.revokeObjectURL(u); }; im.onerror=()=>res(null); im.src=u; }); }
function videoThumb(file){ return new Promise(res=>{ const u=URL.createObjectURL(file); const v=document.createElement("video");
  v.preload="metadata"; v.muted=true; v.src=u; v.onloadeddata=()=>{ try{ v.currentTime=0.1; }catch(e){} };
  v.onseeked=()=>{ const c=document.createElement("canvas"); c.width=v.videoWidth||320; c.height=v.videoHeight||180;
    try{ c.getContext("2d").drawImage(v,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.6)); }catch(e){ res(null);} URL.revokeObjectURL(u); };
  v.onerror=()=>res(null); }); }

function handleAct(act, el){
  const id = el.dataset.id;
  switch(act){
    case "sub": state.sub = el.dataset.k; render(); break;
    case "newPlan": planForm(); break;
    case "editPlan": dbGet("records",id).then(planForm); break;
    case "newGuide": guideForm(); break;
    case "editGuide": dbGet("records",id).then(guideForm); break;
    case "newLog": logForm(); break;
    case "editLog": dbGet("logs",id).then(l=>logForm(l,true)); break;
    case "openLog": state.logId=id; render(); break;
    case "planToLog": dbGet("records",id).then(p=>logForm({
        title:(p.title||"")+" 日志", date:p.startDate||fmtDate(new Date()),
        location:p.destination||"", text:"" }, false, p.id)); break;
    case "backLogs": state.logId=null; render(); break;
    case "toVideo": state.videoSrc=id; state.tab="video"; setTab("video"); genVideo(); break;
    case "addMedia": addMediaToLog(id); break;
    case "doAddMedia": doAddMedia(id); break;
    case "delMedia": delMedia(id, el.dataset.mid); break;
    case "newDest": destForm(); break;
    case "destToPlan": dbGet("destinations",id).then(d=>planForm({kind:"plan",status:"todo",title:d.name+" 之行",destination:d.name,tags:d.tags||[]})); break;
    case "destToGuide": dbGet("destinations",id).then(d=>guideForm({kind:"guide",destination:d.name})); break;
    case "destRemind": destRemind(id); break;
    case "doSearch": doSearch(); break;
    case "clearSearch": $("#searchKw").value=""; $("#fProv").value=""; $("#fType").value=""; $("#fSeason").value=""; $("#fStyle").value=""; doSearch(); break;
    case "checkPush": checkPush(true); break;
    case "closeModal": closeModal(); break;
    case "savePlan": savePlan(id); break;
    case "saveGuide": saveGuide(id); break;
    case "saveDest": saveDest(); break;
    case "saveLog": saveLog(id, el.dataset.edit==="1", el.dataset.plan||null); break;
    case "finishPlan": dbGet("records",id).then(r=>{r.status="done";dbPut("records",r).then(()=>{toast("已标记完成");render();});}); break;
    case "unfinishPlan": dbGet("records",id).then(r=>{r.status="todo";dbPut("records",r).then(()=>render());}); break;
    case "delPlan": if(confirm("确认删除该计划？")) dbDel("records",id).then(()=>render()); break;
    case "delGuide": if(confirm("确认删除该攻略？")) dbDel("records",id).then(()=>render()); break;
    case "delLog": if(confirm("确认删除该日志及素材？")) dbDel("logs",id).then(()=>{state.logId=null;render();}); break;
    case "genVideo": genVideo(); break;

  }

async function savePlan(id){
  const data = { kind:"plan", status:"todo",
    title:$("#f_title").value.trim(), destination:$("#f_dest").value.trim(),
    startDate:$("#f_start").value||"", endDate:$("#f_end").value||"",
    tags:$("#f_tags").value.split(",").map(s=>s.trim()).filter(Boolean),
    notes:$("#f_notes").value.trim() };
  if(!data.title){ toast("请填标题"); return; }
  if(id){ const old=await dbGet("records",id); Object.assign(old,data); await dbPut("records",old); }
  else { data.id=uid(); data.createdAt=Date.now(); await dbPut("records",data); }
  closeModal(); render(); toast("已保存");
}
async function saveGuide(id){
  const collect=(boxId)=>[...document.getElementById(boxId).querySelectorAll(".tiprow")].map(r=>({angle:r.querySelector(".t-angle").value.trim(),content:r.querySelector(".t-content").value.trim()})).filter(t=>t.angle||t.content);
  const data = { kind:"guide", destination:$("#g_dest").value.trim(), title:$("#g_title").value.trim(),
    photoTips:collect("gPhoto"), videoTips:collect("gVideo"), updatedAt:Date.now() };
  if(!data.destination){ toast("请填关联目的地"); return; }
  if(id){ const old=await dbGet("records",id); Object.assign(old,data); old.updatedAt=Date.now(); await dbPut("records",old); }
  else { data.id=uid(); data.createdAt=Date.now(); await dbPut("records",data); }
  closeModal(); render(); toast("已保存");
}
async function saveLog(id, isEdit, planId){
  const data = { title:$("#l_title").value.trim(), date:$("#l_date").value||fmtDate(new Date()),
    location:$("#l_loc").value.trim(), text:$("#l_text").value.trim() };
  if(!isEdit){
    const files = $("#l_files").files;
    const media = [];
    for(const f of files){
      const kind = f.type.startsWith("video")?"video":"image";
      const thumb = kind==="image"? await imgThumb(f) : await videoThumb(f);
      media.push({ id:uid(), kind, blob:f, name:f.name, size:f.size, thumb, tags:{shot:"",angle:"",golden:false,mood:""}, caption:"" });
    }
    data.media = media; data.id = uid(); data.createdAt=Date.now();
    if(planId) data.planId = planId;
    await dbPut("logs", data);
    closeModal(); state.logId=data.id; render(); toast(`已保存，${media.length} 条素材`);
  } else {
    const old = await dbGet("logs", id); Object.assign(old, data);
    if(planId && !old.planId) old.planId = planId;
    await dbPut("logs", old); closeModal(); state.logId=id; render(); toast("已保存");
  }
}

      <div><label>省份</label><input id="d_prov" placeholder="如：浙江"></div>
      <div><label>类型</label><select id="d_type"><option>自然</option><option>人文</option><option>城市</option><option>海岛</option></select></div>
    </div>
    <div class="row">
      <div><label>玩法</label><select id="d_style"><option>休闲</option><option>摄影</option><option>探险</option><option>美食</option><option>历史</option></select></div>
      <div><label>最佳月份(逗号,1-12)</label><input id="d_best" placeholder="如：3,4,9,10"></div>
    </div>
    <label>标签(逗号)</label><input id="d_tags" placeholder="如：湖岛,骑行">
    <label>简介</label><textarea id="d_desc" placeholder="一句话亮点"></textarea>
  `, `<div class="modal-actions"><button class="ghost" data-act="closeModal">取消</button><button class="primary" data-act="saveDest">保存</button></div>`);
}
async function saveDest(){
  const best = ($("#d_best").value||"").split(",").map(s=>parseInt(s.trim())).filter(n=>n>=1&&n<=12);
  const data = { id:uid(), name:$("#d_name").value.trim(), province:$("#d_prov").value.trim(),
    type:$("#d_type").value, playStyle:$("#d_style").value, best, tags:($("#d_tags").value||"").split(",").map(s=>s.trim()).filter(Boolean),
    desc:$("#d_desc").value.trim(), photo:[], video:[], addedByUser:true };
  if(!data.name){ toast("请填名称"); return; }
  await dbPut("destinations", data); closeModal(); if(state.sub==="explore"){ render(); } toast("目的地已加入库");
}
async function destRemind(id){
  const d = await dbGet("destinations", id); if(!d) return;
  const r = { id:uid(), kind:"season", destId:id, name:d.name, destBest:d.best, enabled:true, firedMonths:[] };
  await dbPut("reminders", r);
  toast(`已设「${d.name}」当季提醒`);
}

/* ============ 本地推送 ============ */
async function enableNotify(){
  if(!("Notification" in window)){ toast("此浏览器不支持通知"); return; }
  if(Notification.permission==="granted"){ toast("通知已开启"); return; }
  const p = await Notification.requestPermission();
  toast(p==="granted"?"通知已开启，到时会弹窗提醒":"已取消，仅应用内提醒");
}
async function checkPush(force){
  const items = [];
  const now = new Date(); const ym = now.getFullYear()+"-"+(now.getMonth()+1);
  const firedKey = "pushFired-"+ym;
  const fired = await getMeta(firedKey, []);
  // 当季推荐
  if(await getMeta("pushSeasonal", true)){
    const month = now.getMonth()+1;
    const dests = (await dbAll("destinations")).filter(d=>(d.best||[]).includes(month));
    if(dests.length){
      const key = "season-"+month;
      if(force || !fired.includes(key)){
        items.push({type:"season", icon:"🌸", title:`${month}月当季好去处`, desc:`这月最适合去的：${dests.slice(0,6).map(d=>d.name).join("、")}`, dests:dests.slice(0,6)});
        if(!fired.includes(key)) fired.push(key);
      }
    }
  }
  // 出行前提醒
  if(await getMeta("pushPretrip", true)){
    const plans = await dbAll("records");
    plans.filter(r=>r.kind==="plan"&&r.status!=="done"&&r.startDate).forEach(p=>{
      const diff = Math.ceil((new Date(p.startDate)-now)/86400000);
      if(diff>=0 && diff<=3){
        const key = "trip-"+p.id;
        if(force || !fired.includes(key)){
          items.push({type:"trip", icon:"🎒", title:`${diff===0?"今天":diff+"天后"}出发：${p.title}`, desc:"检查证件/相机/充电宝，参考攻略与天气"});
          if(!fired.includes(key)) fired.push(key);
        }
      }
    });
  }
  // 显式目的地当季提醒
  const rems = await dbAll("reminders");
  const month = now.getMonth()+1;
  rems.filter(r=>r.kind==="season"&&(r.destBest||[]).includes(month)).forEach(r=>{
    const key="r-"+r.id; if(force||!fired.includes(key)){ items.push({type:"remind",icon:"📍",title:`${r.name} 进入最佳季节`,desc:"计划出发吧，可加入旅游计划"}); if(!fired.includes(key))fired.push(key);} });
  await setMeta(firedKey, fired);
  await setMeta("pushItems", items);
  renderPushList(items);
  if(items.length && "Notification" in window && Notification.permission==="granted"){
    items.slice(0,3).forEach(it=>{ try{ new Notification(it.title,{body:it.desc}); }catch(e){} });
  }
  toast(items.length?`推送 ${items.length} 条`:"暂无新推送");
}

/* ============ 备份 / 恢复 ============ */
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
function b64ToBlob(b64,type){ const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:type||""}); }
async function exportData(){
  const logs = await dbAll("logs");
  for(const l of logs){ if(l.media) for(const m of l.media){ if(m.blob&&m.blob.size!=null) m.blob = {__b64:await blobToB64(m.blob), __type:m.blob.type}; } }
  const data = { app:"travelApp", version:1, exportedAt:new Date().toISOString(),
    records:await dbAll("records"), logs, destinations:await dbAll("destinations"),
    reminders:await dbAll("reminders"), meta:await dbAll("meta") };
  const blob = new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="游记志备份-"+fmtDate(new Date())+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("已导出备份");
}
async function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const text = await f.text(); let data;
  try{ data = JSON.parse(text); }catch(err){ toast("文件解析失败"); return; }
  if(!confirm("恢复将合并覆盖同名数据，继续？")) return;
  for(const store of ["records","logs","destinations","reminders","meta"]){
    if(!data[store]) continue;
    for(const item of data[store]){
      if(store==="logs" && item.media){ item.media.forEach(m=>{ if(m.blob&&m.blob.__b64) m.blob=b64ToBlob(m.blob.__b64, m.blob.__type); }); }
      await dbPut(store, item);
    }
  }
  await setMeta("seeded", true);
  closeModal(); render(); toast("恢复完成");
  e.target.value="";
}

/* ============ 启动 ============ */
async function boot(){
  try{ await openDB(); }catch(e){ document.getElementById("view").innerHTML=`<div class="empty">无法打开本地数据库（IndexedDB）。请用浏览器打开本地服务器访问，而非直接双击文件。<br><br>在本文件夹运行：<br><code>python3 -m http.server 8080</code><br>再访问 http://localhost:8080</div>`; return; }
  await seedIfNeeded();
  bindGlobal();
  render();
  // 启动时顺带检查推送（不强制弹通知，仅更新推送中心）
  checkPush(false);
  // 注册 Service Worker（需 http(s) 环境）
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
}
boot();
</script>
