<style>
  :root{
    --bg:#f7f5f0; --panel:#ffffff; --text:#2b2b2b; --muted:#8a8a8a;
    --line:#e7e3da; --brand:#4a7ba6; --brand-soft:#eaf1f6; --amber:#d99a4e;
    --green:#5b9a6b; --red:#c46a5e; --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
    padding-bottom:72px;
  }
  /* 顶栏 */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 14px; border-bottom:1px solid var(--line);
  }
  .brand{font-size:17px; font-weight:600; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .brand small{color:var(--muted); font-weight:400; font-size:12px; margin-left:6px}
  .topactions{display:flex; gap:6px; flex-shrink:0}
  .topactions button{padding:6px 9px}
  @media (max-width:440px){ .brand small{display:none} .topbar{padding:10px} .topactions button{padding:6px 7px; font-size:12px} }
  /* 通用控件 */
  button{
    font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel);
    color:var(--text); border-radius:10px; padding:7px 12px; transition:.15s;
  }
  button:hover{border-color:var(--brand)}
  button.primary{background:var(--brand); color:#fff; border-color:var(--brand)}
  button.primary:hover{filter:brightness(1.05)}
  button.ghost{background:transparent; border-color:transparent; color:var(--brand)}
  button.sm{padding:4px 9px; font-size:13px; border-radius:8px}
  button.danger{color:var(--red); border-color:#f0d8d3}
  input,select,textarea{
    font:inherit; width:100%; padding:9px 11px; border:1px solid var(--line);
    border-radius:10px; background:var(--panel); color:var(--text); outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  textarea{resize:vertical; min-height:64px}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px}
  .row{display:flex; gap:10px}
  .row>*{flex:1}
  /* 内容区 */
  main{padding:16px; max-width:880px; margin:0 auto}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 6px; font-size:16px}
  .meta{color:var(--muted); font-size:13px}
  .tag{display:inline-block; background:var(--brand-soft); color:var(--brand);
    font-size:12px; padding:2px 8px; border-radius:20px; margin:2px 4px 2px 0}
  .tag.amber{background:#fbeed9; color:#b07d2e}
  .tag.green{background:#e4f0e7; color:#3f7a52}
  .pill{display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); border:1px solid var(--line); padding:2px 9px; border-radius:20px}
  .empty{text-align:center; color:var(--muted); padding:40px 16px}
  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  /* 子标签 */
  .subtabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
  .subtabs button{border:none; background:transparent; color:var(--muted); padding:6px 4px; border-bottom:2px solid transparent; border-radius:0}
  .subtabs button.active{color:var(--brand); border-bottom-color:var(--brand); font-weight:600}
  /* 媒体网格 */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin-top:10px}
  .grid .item{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#0001}
  .grid .item img,.grid .item video{width:100%; height:96px; object-fit:cover; display:block}
  .grid .item .cap{padding:5px 7px; font-size:11px; color:var(--muted)}
  /* 底部 Tab */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; background:var(--panel); border-top:1px solid var(--line);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1; border:none; background:transparent; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; padding:6px 0;
  }
  .tabbar button.active{color:var(--brand)}
  .tabbar button .ic{font-size:20px}
  /* 模态框 */
  .modal{position:fixed; inset:0; z-index:50; background:rgba(40,40,40,.45);
    display:flex; align-items:flex-end; justify-content:center}
  .modal.hidden{display:none}
  .modal-box{
    background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow:auto;
    border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:up .2s ease;
  }
  @keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
  .modal-box h2{margin:0 0 6px; font-size:18px}
  .modal-actions{display:flex; gap:10px; margin-top:16px}
  .modal-actions button{flex:1}
  /* 提示条 */
  .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
    background:#2b2b2b; color:#fff; padding:9px 16px; border-radius:22px; font-size:13px; z-index:60; opacity:0; transition:.25s}
  .toast.show{opacity:1}
  /* 短视频分镜 */
  .scene{border-left:3px solid var(--brand); padding:8px 12px; margin:8px 0; background:var(--panel); border-radius:0 10px 10px 0}
  .scene .no{font-weight:600; color:var(--brand)}
  .tip-box{background:var(--brand-soft); border-radius:10px; padding:12px; margin:10px 0; font-size:14px}
  .tip-box b{color:var(--brand)}
  .hidden{display:none!important}
  .switch{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line)}
  .switch:last-child{border-bottom:none}
  details{margin:10px 0}
  summary{cursor:pointer; color:var(--brand); font-size:14px}
  .seg{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0}
  .seg button{padding:5px 10px; font-size:13px}
  .seg button.on{background:var(--brand); color:#fff; border-color:var(--brand)}
  /* 频道 / 偏好 胶囊 */
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
  .chip{font-size:13px; border:1px solid var(--line); background:var(--panel);

  .chip:hover{border-color:var(--brand)}
  .chip.on{background:var(--brand); color:#fff; border-color:var(--brand)}
  /* 站外搜索渠道 */
  .ext{display:inline-block; font-size:12px; color:var(--brand); border:1px solid var(--line);
    background:var(--panel); border-radius:20px; padding:3px 10px; margin:3px 5px 0 0; text-decoration:none}
  .ext:hover{border-color:var(--brand)}
  summary{list-style:none}
  summary::-webkit-details-marker{display:none}
  .moremenu{display:flex; flex-direction:column; gap:2px; margin:4px 0 2px}
  .moreitem{display:flex; align-items:center; gap:10px; padding:13px 10px; border:none; background:none;
    font-size:15px; color:var(--text); text-align:left; border-bottom:1px solid var(--line); cursor:pointer}
  .moreitem:last-child{border-bottom:none}
  .moreitem:active{background:var(--bg)}
  .moreitem .no{font-size:17px}
</style>

/* ============ IndexedDB ============ */
const DB = { db:null };
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("youjizhiDB", 1);
    r.onupgradeneeded = (e)=>{
      const db = e.target.result;
      const mk = (name)=>{ if(!db.objectStoreNames.contains(name)) db.createObjectStore(name,{keyPath:"id"}); };
      ["records","logs","destinations","reminders","meta"].forEach(mk);
      if(!db.transaction){}
    };
    r.onsuccess = ()=>{ DB.db = r.result; res(DB.db); };
    r.onerror = ()=>rej(r.error);
  });
}
function tx(store, mode){ return DB.db.transaction(store, mode).objectStore(store); }
function dbPut(store, val){ return new Promise((res,rej)=>{ const r=tx(store,"readwrite").put(val); r.onsuccess=()=>res(val); r.onerror=()=>rej(r.error); }); }
function dbGet(store, id){ return new Promise((res,rej)=>{ const r=tx(store,"readonly").get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbAll(store){ return new Promise((res,rej)=>{ const r=tx(store,"readonly").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
function dbDel(store, id){ return new Promise((res,rej)=>{ const r=tx(store,"readwrite").delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
function getMeta(key, def){ return dbGet("meta", key).then(v=> v ? v.value : def); }
function setMeta(key, value){ return dbPut("meta", {id:key, value}); }

function buildDest(s){
  return { id:uid(), name:s[0], province:s[1], type:s[2], playStyle:s[3], best:s[4],

async function seedIfNeeded(){
  const ver = await getMeta("seedVersion", 0);
  if(ver >= SEED_VERSION) return;
  const existing = await dbAll("destinations");
  const have = new Set(existing.map(d=>d.name));
  for(const d of SEED_DEST){
    if(have.has(d.name)) continue;
    await dbPut("destinations", {id:uid(), name:d.name, province:d.province, type:d.type,
      playStyle:d.playStyle, best:d.best, tags:d.tags, desc:d.desc, photo:d.photo, video:d.video, addedByUser:false});
  }
  for(const s of SEED_MORE){
    if(have.has(s[0])) continue;
    await dbPut("destinations", buildDest(s));
  }
  await setMeta("seedVersion", SEED_VERSION);
  await setMeta("seeded", true);
}

    (d.photo||[]).forEach(x=>out.photo.push(typeof x==="string"?{angle:"推荐机位",content:x}:x));

  }
  const byType = {
    "海岛":[["日出/日落机位","黄金时刻拍海平线金光与逆光剪影"],["对称倒影","找无风水面拍倒影；水下用广角"]],

    "古镇":[["清晨无人巷","趁早拍空巷；傍晚红灯笼倒映水面"],["门洞廊棚","用门洞或廊棚做引导线纵深"]],
    "雪山":[["日照金山","日出前后拍雪峰金光"],["广角压迫感","低角度广角强调雪峰体量"]],
    "草原":[["地平线低机位","压到地面拍牛羊与天地线"],["曲线构图","利用河曲或公路 S 形引导线"]],
    "沙漠":[["脊线风纹","低角度拍沙丘脊线与风纹"],["人影点缀","用人物剪影交代尺度"]],
    "湖泊":[["镜面倒影","无风时拍上下对称倒影"],["晨雾空镜","清晨薄雾配远山层次"]],
    "温泉":[["水汽氛围","逆光拍蒸汽缭绕"],["环境连带","带出雪山或森林环境"]]
  };
  (byType[d.type]||byType["自然"]).forEach(x=>out.photo.push({angle:x[0],content:x[1]}));
  const vt = {
    "海岛":"航拍海岸线慢推；海浪慢动作配环境音",
    "自然":"航拍或摇镜交代大环境；延时拍光影云海",
    "人文":"慢走过巷的跟拍；夜景灯光长镜",
    "城市":"延时拍车流与日夜转换；第一视角 citywalk",
    "古镇":"摇橹船或漫步长镜；夜景延时",
    "雪山":"日照金山延时；徒步第一视角",
    "草原":"骑马或驱车跟拍；银河延时",

    "温泉":"蒸汽升腾慢镜；环境连带空镜"

async function smartRec(){
  const selTypes = $$('[data-pref="type"] .chip.on').map(c=>c.dataset.v);
  const selCrowd = $$('[data-pref="crowd"] .chip.on').map(c=>c.dataset.v);
  const season = $("#pSeason").value, style = $("#pStyle").value;
  const hasPref = selTypes.length||selCrowd.length||season||style;
  const m = new Date().getMonth()+1;
  const dests = await dbAll("destinations");
  const scored = dests.map(d=>{
    let sc = 0;
    if(selTypes.length){ sc += selTypes.includes(d.type) ? 2 : -1; }
    selCrowd.forEach(c=>{ if((d.tags||[]).includes(c)) sc += 2; });
    if(season && d.best.some(x=>SEASON[season].includes(x))) sc += 3;
    if(style && d.playStyle===style) sc += 2;
    if(d.best.includes(m)) sc += 1;
    return {d, sc};
  }).filter(x=> hasPref ? x.sc>0 : true).sort((a,b)=> b.sc-a.sc);
  renderDestList($("#recRes"), scored.slice(0,12).map(x=>x.d), hasPref?"✨ 为你推荐：":"✨ 当季热门：");
}

function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function coverGrid(){
  const logId = state.videoSrc || (LAST_VIDEO&&LAST_VIDEO.logId);
  if(!logId){ toast("请先在上方选一条日志并生成方案"); return; }
  const l = await dbGet("logs", logId); if(!l){ toast("日志不存在"); return; }
  const imgs = (l.media||[]).filter(x=>x.kind==="image");
  if(!imgs.length){ toast("这条日志没有照片，九宫格需要图片素材"); return; }
  const pick = imgs.slice(0,9);
  const N=3, CELL=360, size=CELL*N;
  const cv = document.createElement("canvas"); cv.width=size; cv.height=size;
  const ctx = cv.getContext("2d");
  ctx.fillStyle="#f7f5f0"; ctx.fillRect(0,0,size,size);
  for(let i=0;i<pick.length;i++){
    const col=i%3, row=Math.floor(i/3), x=col*CELL, y=row*CELL;
    let im; try{ im = await loadImg(objUrl(pick[i].blob, pick[i].id)); }catch(e){ continue; }
    const s=Math.max(CELL/im.width, CELL/im.height);
    const w=im.width*s, h=im.height*s;
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,CELL,CELL); ctx.clip();
    ctx.drawImage(im, x+(CELL-w)/2, y+(CELL-h)/2, w, h); ctx.restore();
  }
  ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=4;
  for(let i=1;i<N;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(size,i*CELL); ctx.stroke();
  }
  const title=(l.title||l.location||"游记").slice(0,14);

function seasonOf(m){ return [3,4,5].includes(m)?"春":[6,7,8].includes(m)?"夏":[9,10,11].includes(m)?"秋":"冬"; }
async function genGuide(plan, destOverride){
  const name = (destOverride || (plan&&plan.destination) || "").trim();
  const dests = await dbAll("destinations");
  const d = dests.find(x=>x.name===name)
         || dests.find(x=> name && (x.name.includes(name)||name.includes(x.name)))
         || dests.find(x=> name && name.includes(x.name))
         || null;
  const days = (plan&&plan.startDate&&plan.endDate)
    ? Math.max(1, Math.round((new Date(plan.endDate)-new Date(plan.startDate))/86400000)+1) : 0;
  const month = (plan&&plan.startDate) ? (new Date(plan.startDate).getMonth()+1) : (new Date().getMonth()+1);
  const season = seasonOf(month);
  const tags = [...new Set([...((plan&&plan.tags)||[]), ...(d?(d.tags||[]):[])])];
  const type = d ? d.type : "自然";

  const base = destTips(d || {type:"自然", photo:[], video:[]});
  const photo = base.photo.slice();
  const video = base.video.slice();
  const spots = [], checklist = ["充电宝", "存储卡/备用电池", "雨具"], captions = [], tips = [];

  // 季节
  const seasonTip = {
    "春":["花期与雨天并存，备防水与浅色系服装，花海用逆光更通透","清晨易起雾，是拍仙气空镜的好时机"],
    "夏":["正午光硬，尽量早出晚归，抓日出后与日落前 1 小时","紫外线强，做好防晒，海边/高原注意逆光过曝"],
    "秋":["层林尽染是全年最佳出片季，黄金时刻更长","早晚温差大带抓绒；落叶与水面倒影是重点题材"],
    "冬":["雪景加 +1EV 曝光补偿，避免画面发灰，戴可触屏手套","日短光柔，适合暖调人像与夜景灯光"]
  }[season];
  tips.push(`${month}月出行（${season}）：${seasonTip[0]}`, seasonTip[1]);

  // 天数/节奏
  if(days>1) tips.push(`${days} 天行程：给每天定一个"打卡主视觉"（地标/日出/美食各一），避免素材同质化`);
  else tips.push(`单日行程：集中抓 1 个日出或日落黄金时段 + 1 个地标，效率最高`);

  // 人群/主题定制
  if(tags.includes("亲子")){
    photo.push({angle:"亲子抓拍", content:"多连拍孩子自然瞬间，蹲到孩子视平线，避开正午强光"});
    checklist.push("儿童防晒/湿巾/小零食", "轻便推车或背带");
    captions.push("带娃也能出片，这份攻略照抄就行");
  }
  if(tags.includes("情侣")) photo.push({angle:"情侣同框", content:"三脚架 + 延时自拍，逆光剪影或牵手背影最出片"});
  if(tags.includes("摄影") || (d&&d.playStyle==="摄影")){
    photo.push({angle:"专业出片", content:"带三脚架拍日出/星空；黄金时刻优先，宁欠不过曝"});
    checklist.push("三脚架", "广角 + 长焦", "ND / CPL 滤镜");
  }
  if(tags.includes("美食") || (d&&d.playStyle==="美食")){
    photo.push({angle:"美食特写", content:"俯拍加手部动作，借店内暖光，先拍整桌再拍单品"});
    video.push({angle:"美食镜头", content:"上菜瞬间、拉丝/热气特写，配咀嚼声更有食欲"});
  }
  if(tags.includes("小众")) tips.push("小众目的地配套少：提前订好交通住宿，备些现金与干粮");
  if(tags.includes("徒步") || (d&&d.playStyle==="探险")){
    checklist.push("登山鞋", "冲锋衣", "水与能量补给", "头灯");
    tips.push("徒步线路量力而行，提前看天气，尽量结伴");
  }
  if(tags.includes("避暑")) tips.push("避暑地早晚偏凉，带件薄外套；午后多阵雨，行程留弹性");

  // 打卡点清单（按类型）
  const spotMap = {
    "自然":["主峰/核心观景台（日出机位）","溪流或湖泊倒影机位","经典步道中段回望全景"],
    "人文":["地标建筑正立面对称机位","老街巷弄光影","室内展陈/壁画特写","夜色灯光机位"],
    "城市":["城市天际线高点","地标建筑近景","街角烟火气抓拍","夜景车流/灯光"],
    "海岛":["海滩日出机位","灯塔/码头地标","礁石海浪慢门","日落椰林剪影"],
    "古镇":["清晨空巷","桥头/水边倒影","红灯笼夜景","手作/小吃摊特写"],
    "雪山":["日照金山机位","雪线徒步视角","冰川/海子倒影"],
    "草原":["地平线牛羊机位","河曲 S 形俯拍","毡房/牧民人文"],
    "沙漠":["沙丘脊线风纹","驼队剪影","星空银河机位"],
    "湖泊":["镜面倒影机位","湖畔晨雾","环湖高点全景"],
    "温泉":["蒸汽逆光机位","泉池环境连带","雪景温泉同框"]
  };
  (spotMap[type] || spotMap["自然"]).forEach(s=>spots.push(s));
  if(d && d.desc) tips.push(`目的地要点：${d.desc}`);
  if(!d && name) tips.push(`库里暂无「${name}」资料，已按通用规则生成；可在「探索」里新增它，下次更准`);

  // 文案模板
  const place = (d&&d.name) || name || (plan&&plan.title) || "这里";
  captions.push(`别人去${place}拍游客照，我拍的是壁纸`);
  captions.push(`${month}月的${place}，值回票价`);
  captions.push(`${place}打卡攻略｜几个机位照着拍就行`);
  captions.push(`这一趟${place}，把${season}天装进相册`);

  return {
    kind:"guide", planId: plan?plan.id:null,
    destination: place,
    title: ((plan&&plan.title) || place) + " 打卡攻略",
    photoTips: photo, videoTips: video,
    spots, checklist, captions, tips,
    sourcePlanTitle: plan ? plan.title : "",
    updatedAt: Date.now()
  };
}

async function aiConfigGet(){
  return await getMeta("aiConfig", {enabled:false, preset:"deepseek", base:"", key:"", model:""});
}
async function callAI(messages, cfg, opts){
  const url = cfg.base.replace(/\/+$/,"") + "/chat/completions";
  const body = Object.assign({ model:cfg.model, messages, temperature:0.7 }, opts||{});
  const res = await fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text().catch(()=>""); throw new Error("HTTP "+res.status+" "+t.slice(0,140)); }
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
}
function aiErrHint(e){
  const msg = (e && e.message) || String(e);
  if(/Failed to fetch|NetworkError|Load failed|TypeError/i.test(msg)) return "网络或跨域(CORS)被拦截，换一个支持跨域的接口";
  if(/402|Insufficient Balance/i.test(msg)) return "账户余额不足 —— 去 Key 所属服务商官网充值后重试（Key 和配置都没问题）";
  if(/401|403|invalid.*key|Unauthorized|auth/i.test(msg)) return "Key 无效或未生效 —— 检查是否复制完整、是否已创建成功";
  if(/429|rate.?limit/i.test(msg)) return "请求太频繁，等几秒再试";
  if(/404|model.*not.*found|not_found/i.test(msg)) return "模型名不对 —— 检查模型框拼写，或恢复默认预设";
  return msg.slice(0,140);
}
function parseJSONLoose(s){
  if(!s) return null;
  const t = String(s).replace(/```json/gi,"").replace(/```/g,"").trim();
  try{ return JSON.parse(t); }catch(e){}
  const m = t.match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}

/* AI 优先生成，失败回退本地规则引擎 */
async function aiGenerateGuide(plan, local){
  const cfg = await aiConfigGet();
  const days = (plan&&plan.startDate&&plan.endDate) ? Math.max(1, Math.round((new Date(plan.endDate)-new Date(plan.startDate))/86400000)+1) : 0;
  const planDesc = plan
    ? `行程标题：${plan.title||""}\n目的地：${plan.destination||local.destination}\n日期：${plan.startDate||"未定"} ~ ${plan.endDate||"未定"}（约 ${days} 天）\n标签：${(plan.tags||[]).join("、")||"无"}\n备注：${plan.notes||"无"}`
    : `目的地：${local.destination}`;
  const sys = "你是资深旅行摄影与短视频策划。根据用户的行程，输出针对性强、可执行的打卡攻略。只输出 JSON，不要任何解释或代码块标记。";
  const schema = '{"title":"攻略标题","photoTips":[{"angle":"机位/角度","content":"具体怎么拍"}],"videoTips":[{"angle":"拍摄方式","content":"怎么拍视频"}],"spots":["打卡点1","打卡点2"],"tips":["行前/实战贴士"],"checklist":["装备1","装备2"],"captions":["可直接用的文案/字幕"]}';
  const user = `${planDesc}\n\n请生成：拍照建议 4-6 条、拍视频建议 3-4 条、打卡点清单 4-6 个、行前贴士 3-5 条、装备清单 5-8 条、文案模板 4 条。中文，具体可执行，结合当地特色、季节与出行人群。严格按此 JSON 结构输出：\n${schema}`;
  const content = await callAI([{role:"system",content:sys},{role:"user",content:user}], cfg, {response_format:{type:"json_object"}});
  const obj = parseJSONLoose(content);
  if(!obj) throw new Error("无法解析 AI 返回内容");
  return {
    kind:"guide", planId: plan?plan.id:null,
    destination: local.destination,
    title: obj.title || local.title,
    photoTips: normTips(obj.photoTips).length ? normTips(obj.photoTips) : local.photoTips,
    videoTips: normTips(obj.videoTips).length ? normTips(obj.videoTips) : local.videoTips,
    spots: normArr(obj.spots), tips: normArr(obj.tips), checklist: normArr(obj.checklist), captions: normArr(obj.captions),
    sourcePlanTitle: plan ? plan.title : "",
    aiGenerated: true, updatedAt: Date.now()
  };
}
async function aiOrLocalGuide(plan, destOverride){
  const local = await genGuide(plan, destOverride);
  const cfg = await aiConfigGet();
  if(!cfg.enabled || !cfg.base || !cfg.key || !cfg.model) return local;
  toast("🤖 AI 生成中…");
  try{
    const g = await aiGenerateGuide(plan, local);
    toast("AI 生成完成");
    return g;
  }catch(e){
    console.warn("[AI] failed:", e);
    toast("AI 调用失败，已用本地生成（" + aiErrHint(e) + "）");
    return local;
  }
}

/* ============ 媒体缩略图 ============ */
function imgThumb(file){ return new Promise(res=>{ const u=URL.createObjectURL(file); const im=new Image();
  im.onload=()=>{ const c=document.createElement("canvas"); const M=360; const r=Math.min(M/im.width,M/im.height);
    c.width=im.width*r||M; c.height=im.height*r||M; c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",0.72)); URL.revokeObjectURL(u); }; im.onerror=()=>res(null); im.src=u; }); }
function videoThumb(file){ return new Promise(res=>{ const u=URL.createObjectURL(file); const v=document.createElement("video");
  v.preload="metadata"; v.muted=true; v.src=u; v.onloadeddata=()=>{ try{ v.currentTime=0.1; }catch(e){} };
  v.onseeked=()=>{ const c=document.createElement("canvas"); c.width=v.videoWidth||320; c.height=v.videoHeight||180;
    try{ c.getContext("2d").drawImage(v,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.6)); }catch(e){ res(null);} URL.revokeObjectURL(u); };
  v.onerror=()=>res(null); }); }

  else { data.id=uid(); data.createdAt=Date.now(); await dbPut("records",data); }

async function saveGuide(id, planId){
  const collect=(boxId)=>[...document.getElementById(boxId).querySelectorAll(".tiprow")].map(r=>({angle:r.querySelector(".t-angle").value.trim(),content:r.querySelector(".t-content").value.trim()})).filter(t=>t.angle||t.content);

  const data = { kind:"guide", destination:$("#g_dest").value.trim(), title:$("#g_title").value.trim(),
    photoTips:collect("gPhoto"), videoTips:collect("gVideo"),
    spots:toLines("gSpots"), tips:toLines("gTips"), checklist:toLines("gChecklist"), captions:toLines("gCaptions"),
    updatedAt:Date.now() };
  if(!data.destination){ toast("请填关联目的地"); return; }
  if(id){ const old=await dbGet("records",id); Object.assign(old,data); if(planId) old.planId=planId; old.updatedAt=Date.now(); await dbPut("records",old); }
  else { data.id=uid(); data.createdAt=Date.now(); if(planId) data.planId=planId; await dbPut("records",data); }
  closeModal(); render(); toast("已保存");
}
async function saveLog(id, isEdit, planId){
  const data = { title:$("#l_title").value.trim(), date:$("#l_date").value||fmtDate(new Date()),
    location:$("#l_loc").value.trim(), text:$("#l_text").value.trim() };
  if(!isEdit){
    const files = $("#l_files").files;
    const media = [];
    for(const f of files){
      const kind = f.type.startsWith("video")?"video":"image";
      const thumb = kind==="image"? await imgThumb(f) : await videoThumb(f);
      media.push({ id:uid(), kind, blob:f, name:f.name, size:f.size, thumb, tags:{shot:"",angle:"",golden:false,mood:""}, caption:"" });
    }
    data.media = media; data.id = uid(); data.createdAt=Date.now();
    if(planId) data.planId = planId;
    await dbPut("logs", data);
    closeModal(); state.logId=data.id; render(); toast(`已保存，${media.length} 条素材`);
  } else {
    const old = await dbGet("logs", id); Object.assign(old, data);
    if(planId && !old.planId) old.planId = planId;
    await dbPut("logs", old); closeModal(); state.logId=id; render(); toast("已保存");
  }
}

async function enableNotify(){
  if(!("Notification" in window)){ toast("此浏览器不支持通知"); return; }
  if(Notification.permission==="granted"){ toast("通知已开启"); return; }
  const p = await Notification.requestPermission();

}
async function checkPush(force){
  const items = [];
  const now = new Date(); const ym = now.getFullYear()+"-"+(now.getMonth()+1);
  const firedKey = "pushFired-"+ym;
  const fired = await getMeta(firedKey, []);
  // 当季推荐
  if(await getMeta("pushSeasonal", true)){
    const month = now.getMonth()+1;
    const dests = (await dbAll("destinations")).filter(d=>(d.best||[]).includes(month));
    if(dests.length){
      const key = "season-"+month;
      if(force || !fired.includes(key)){
        items.push({type:"season", icon:"🌸", title:`${month}月当季好去处`, desc:`这月最适合去的：${dests.slice(0,6).map(d=>d.name).join("、")}`, dests:dests.slice(0,6)});
        if(!fired.includes(key)) fired.push(key);
      }
    }
  }
  // 出行前提醒
  if(await getMeta("pushPretrip", true)){
    const plans = await dbAll("records");
    plans.filter(r=>r.kind==="plan"&&r.status!=="done"&&r.startDate).forEach(p=>{
      const diff = Math.ceil((new Date(p.startDate)-now)/86400000);
      if(diff>=0 && diff<=3){
        const key = "trip-"+p.id;
        if(force || !fired.includes(key)){
          items.push({type:"trip", icon:"🎒", title:`${diff===0?"今天":diff+"天后"}出发：${p.title}`, desc:"检查证件/相机/充电宝，参考攻略与天气"});
          if(!fired.includes(key)) fired.push(key);
        }
      }
    });
  }
  // 显式目的地当季提醒
  const rems = await dbAll("reminders");
  const month = now.getMonth()+1;
  rems.filter(r=>r.kind==="season"&&(r.destBest||[]).includes(month)).forEach(r=>{
    const key="r-"+r.id; if(force||!fired.includes(key)){ items.push({type:"remind",icon:"📍",title:`${r.name} 进入最佳季节`,desc:"计划出发吧，可加入旅游计划"}); if(!fired.includes(key))fired.push(key);} });
  await setMeta(firedKey, fired);
  await setMeta("pushItems", items);
  renderPushList(items);
  if(items.length && "Notification" in window && Notification.permission==="granted"){
    items.slice(0,3).forEach(it=>{ try{ new Notification(it.title,{body:it.desc}); }catch(e){} });
  }
  toast(items.length?`推送 ${items.length} 条`:"暂无新推送");
}

/* ============ 备份 / 恢复 ============ */
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
function b64ToBlob(b64,type){ const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:type||""}); }
async function exportData(){
  const logs = await dbAll("logs");
  for(const l of logs){ if(l.media) for(const m of l.media){ if(m.blob&&m.blob.size!=null) m.blob = {__b64:await blobToB64(m.blob), __type:m.blob.type}; } }
  const data = { app:"travelApp", version:1, exportedAt:new Date().toISOString(),
    records:await dbAll("records"), logs, destinations:await dbAll("destinations"),
    reminders:await dbAll("reminders"), meta:await dbAll("meta") };
  const blob = new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="游记志备份-"+fmtDate(new Date())+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("已导出备份");
}
async function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const text = await f.text(); let data;
  try{ data = JSON.parse(text); }catch(err){ toast("文件解析失败"); return; }
  if(!confirm("恢复将合并覆盖同名数据，继续？")) return;
  for(const store of ["records","logs","destinations","reminders","meta"]){
    if(!data[store]) continue;
    for(const item of data[store]){
      if(store==="logs" && item.media){ item.media.forEach(m=>{ if(m.blob&&m.blob.__b64) m.blob=b64ToBlob(m.blob.__b64, m.blob.__type); }); }
      await dbPut(store, item);
    }
  }
  await setMeta("seeded", true);
  closeModal(); render(); toast("恢复完成");
  e.target.value="";
}

/* ============ 启动 ============ */
async function boot(){
  try{ await openDB(); }catch(e){ document.getElementById("view").innerHTML=`<div class="empty">无法打开本地数据库（IndexedDB）。请用浏览器打开本地服务器访问，而非直接双击文件。<br><br>在本文件夹运行：<br><code>python3 -m http.server 8080</code><br>再访问 http://localhost:8080</div>`; return; }
  await seedIfNeeded();
  bindGlobal();
  render();
  // 启动时顺带检查推送（不强制弹通知，仅更新推送中心）
  checkPush(false);
  // 注册 Service Worker（需 http(s) 环境）
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    // 已有旧外壳时，新版本接管后自动刷新一次，用户无需手动强刷
    if(navigator.serviceWorker.controller){
      let refreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", ()=>{
        if(refreshed) return; refreshed = true; location.reload();
      });
    }
  }
}
boot();
</script>
